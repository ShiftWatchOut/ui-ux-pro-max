name: Verify mirror

# Guards the invariants that make skills/ installable by CC Switch:
#   1. every skill directory has a parseable SKILL.md with matching name
#   2. no CLAUDE_PLUGIN_ROOT path survives (it cannot resolve outside a Claude
#      Code plugin, which is what broke direct installation of upstream)
#   3. every documented script invocation is skill-relative and points at a file
#      that actually ships (upstream's own contract, see its check-asset-sync.yml)
#   4. the core search tool still runs
#
# skills/ is generated by scripts/build_mirror.py — a failing run here means the
# tree was edited by hand or a sync landed something the builder did not rewrite.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify skills/ contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify mirror
        run: python3 scripts/build_mirror.py verify

      - name: Check that skills/ matches what the builder would produce
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import build_mirror as bm

          manifest = json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          problems = []
          for name, entry in manifest["skills"].items():
              skill_dir = bm.SKILLS_DIR / name
              actual = bm.tree_hash(skill_dir)
              if actual != entry["sha256"]:
                  problems.append(f"{name}: content hash {actual[:12]} != manifest {entry['sha256'][:12]}")
              if bm.count_files(skill_dir) != entry["files"]:
                  problems.append(f"{name}: file count differs from upstream.lock.json")
          if problems:
              print("upstream.lock.json is stale:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              raise SystemExit(1)
          print("upstream.lock.json matches skills/")
          PY

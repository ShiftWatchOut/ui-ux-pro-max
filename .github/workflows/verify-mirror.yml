name: 校验镜像

# 守住「skills/ 能被 CC Switch 正常安装」的几个不变量：
#   1. 每个技能目录都有可解析的 SKILL.md，且 name 与目录名一致
#   2. 不存在 CLAUDE_PLUGIN_ROOT 路径残留（插件外无法解析，正是上游直接加到
#      CC Switch 里装完跑不起来的原因）
#   3. 文档里的脚本调用都是 skill 内相对路径，且指向真实随包发布的文件
#      （等价于上游 check-asset-sync.yml 的路径契约）
#   4. 核心搜索脚本仍能真正跑出结果
#
# skills/ 由 scripts/build_mirror.py 生成：这里红了，说明有人手改了 skills/，或者
# 某次同步把没改写干净的内容带了进来。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 校验 skills/ 契约
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 校验镜像
        run: python3 scripts/build_mirror.py verify

      - name: 核对 skills/ 与 upstream.lock.json 是否一致
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import build_mirror as bm

          manifest = json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          problems = []
          for name, entry in manifest["skills"].items():
              skill_dir = bm.SKILLS_DIR / name
              actual = bm.tree_hash(skill_dir)
              if actual != entry["sha256"]:
                  problems.append(f"{name}：内容哈希 {actual[:12]} != manifest {entry['sha256'][:12]}")
              if bm.count_files(skill_dir) != entry["files"]:
                  problems.append(f"{name}：文件数与 upstream.lock.json 不一致")
          if problems:
              print("upstream.lock.json 已过期：", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              raise SystemExit(1)
          print("upstream.lock.json 与 skills/ 一致")
          PY
